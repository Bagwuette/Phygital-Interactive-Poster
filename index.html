<g clip-path="url(#lid)">
 <g id="eye">
  <path d="M0 260.5Q574 -214 1147 260.5Q574 736 0 260.5Z" fill="url(#scl)"/>
  <g clip-path="url(#lens)"><g id="iris">
   <circle cx="573" cy="260" r="260" fill="url(#irg)"/>
   <g id="pupil"><circle cx="574" cy="268" r="160" fill="#1e1d1d"/></g>
   <circle cx="436.5" cy="151" r="42" fill="#fff"/>
  </g></g>
 </g>
</g></svg>
<button id="tilt">Tap to enable tilt</button>
<script>
const svg=document.getElementById('p'),eye=document.getElementById('eye'),iris=document.getElementById('iris'),pupil=document.getElementById('pupil'),btn=document.getElementById('tilt');
const CX=620,CY=729,K=.567,TX=0,TY=0;
(function(){let top='',bot='';for(let x=0;x<=1240;x+=5){const u=(x-620)/620,h=174*Math.pow(Math.max(0,1-u*u),.85);top+=(x?'L':'M')+x+' '+(CY-h);bot='L'+x+' '+(CY+h)+bot}
document.getElementById('lidp').setAttribute('d',top+bot+'Z')})();
let px=null,py=null,tx=0,ty=0,ex=0,ey=0,lx=0,ly=0,gotOri=false;
function pt(x,y){const m=svg.getScreenCTM();if(!m)return;const p=new DOMPoint(x,y).matrixTransform(m.inverse());px=p.x;py=p.y}
addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||!gotOri)pt(e.clientX,e.clientY)});
addEventListener('pointerdown',e=>{if(!gotOri)pt(e.clientX,e.clientY)});
function onOri(e){
 if(e.beta==null||e.gamma==null)return;gotOri=true;
 const b=e.beta*Math.PI/180,g=e.gamma*Math.PI/180,x=-Math.cos(b)*Math.sin(g),y=Math.sin(b);
 const a=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*Math.PI/180;
 const X=x*Math.cos(a)-y*Math.sin(a),Y=x*Math.sin(a)+y*Math.cos(a),h=Math.hypot(X,Y)||1,s=Math.min(h*1.5,1)/h;
 tx=X*s;ty=-Y*s;
}
function enable(){addEventListener('deviceorientation',onOri)}
const D=window.DeviceOrientationEvent;
if(D&&typeof D.requestPermission==='function'){
 btn.style.display='block';
 btn.onclick=()=>D.requestPermission().then(r=>{if(r==='granted'){enable();btn.style.display='none'}}).catch(()=>{});
}else if(D){enable()}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
(function loop(){
 let tex=0,tey=0,tlx=0,tly=0;
 if(gotOri){tex=tx*TX;tey=ty*TY;tlx=tx;tly=ty}
 else if(px!==null){
  tex=clamp(px-CX,-TX,TX);tey=clamp((py-CY)*.3,-TY,TY);
  const dx=px-(CX+ex),dy=py-(CY+ey),d=Math.hypot(dx,dy)||1,m=Math.min(d/120,1);tlx=dx/d*m;tly=dy/d*m;
 }
 ex+=(tex-ex)*.12;ey+=(tey-ey)*.12;lx+=(tlx-lx)*.2;ly+=(tly-ly)*.2;
 eye.setAttribute('transform','translate('+(CX+ex-574*K)+' '+(CY+ey-260.5*K)+') scale('+K+')');
 iris.setAttribute('transform','translate('+lx*230+' '+ly*45+')');
 pupil.setAttribute('transform','translate('+lx*40+' '+ly*10+')');
 requestAnimationFrame(loop);
})();
</script></body></html>
