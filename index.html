<g clip-path="url(#lid)">
 <circle cx="297" cy="350" r="62" fill="#231f20"/>
 <g id="ball"><circle cx="297" cy="350" r="60" fill="#fff"/>
  <g clip-path="url(#clip)"><g id="iris"><circle cx="297" cy="352" r="47" fill="#c80000"/>
   <g id="pupil"><circle cx="296" cy="351" r="17" fill="#000"/></g>
   <circle cx="321" cy="324" r="13" fill="#fff"/></g></g>
 </g>
</g></svg>
<button id="tilt">Tap to enable tilt</button>
<script>
const svg=document.getElementById('p'),ball=document.getElementById('ball'),iris=document.getElementById('iris'),pupil=document.getElementById('pupil'),btn=document.getElementById('tilt');
// eyelid opening: lens shape clipping the eyeball
(function(){let top='',bot='';for(let x=0;x<=595;x+=5){const u=(x-297.5)/297.5,h=62*Math.pow(Math.max(0,1-u*u),.6);top+=(x?'L':'M')+x+' '+(350-h);bot='L'+x+' '+(350+h)+bot}
document.getElementById('lidp').setAttribute('d',top+bot+'Z')})();
let px=null,py=null,tx=0,ty=0,ex=0,ey=0,lx=0,ly=0,gotOri=false;
function pt(x,y){const m=svg.getScreenCTM();if(!m)return;const p=new DOMPoint(x,y).matrixTransform(m.inverse());px=p.x;py=p.y}
addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||!gotOri)pt(e.clientX,e.clientY)});
addEventListener('pointerdown',e=>{if(!gotOri)pt(e.clientX,e.clientY)});
function onOri(e){
 if(e.beta==null||e.gamma==null)return;gotOri=true;
 const b=e.beta*Math.PI/180,g=e.gamma*Math.PI/180,x=-Math.cos(b)*Math.sin(g),y=Math.sin(b);
 const a=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*Math.PI/180;
 const X=x*Math.cos(a)-y*Math.sin(a),Y=x*Math.sin(a)+y*Math.cos(a),h=Math.hypot(X,Y)||1,s=Math.min(h*1.5,1)/h;
 tx=X*s;ty=-Y*s;
}
function enable(){addEventListener('deviceorientation',onOri)}
const D=window.DeviceOrientationEvent;
if(D&&typeof D.requestPermission==='function'){
 btn.style.display='block';
 btn.onclick=()=>D.requestPermission().then(r=>{if(r==='granted'){enable();btn.style.display='none'}}).catch(()=>{});
}else if(D){enable()}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
(function loop(){
 let tex=0,tey=0,tlx=0,tly=0;
 if(gotOri){tex=tx*190;tey=ty*26;tlx=tx;tly=ty}
 else if(px!==null){
  tex=clamp(px-297,-190,190);tey=clamp((py-350)*.4,-26,26);
  const dx=px-(297+ex),dy=py-(350+ey),d=Math.hypot(dx,dy)||1,m=Math.min(d/80,1);tlx=dx/d*m;tly=dy/d*m;
 }
 ex+=(tex-ex)*.12;ey+=(tey-ey)*.12;lx+=(tlx-lx)*.2;ly+=(tly-ly)*.2;
 ball.setAttribute('transform','translate('+ex+' '+ey+')');
 iris.setAttribute('transform','translate('+lx*13+' '+ly*13+')');
 pupil.setAttribute('transform','translate('+lx*3+' '+ly*3+')');
 requestAnimationFrame(loop);
})();
</script></body></html>
